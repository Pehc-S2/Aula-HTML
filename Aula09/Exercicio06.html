<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 06</title>
    <style>      
        span{
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <h1>Supermercado JS</h1>

    <form action="">
        <p><label for="produto">Produto:</label>
        <input type="text" id="produto"></p>
        <p><label for="preco">Preço R$:</label>
        <input type="text" id="preco"></p>
        <input type="button" id="botao" value="Mostrar Promoção">
    </form>
    <p><span id="msgPromocao"></span></p>
    <p><span id="msgPagamento"></span></p>

    <script>
        function calculo(){
            let produto = document.querySelector('#produto').value;
            let preco = Number(document.querySelector('#preco').value);

            // Calculo
            let terceiroProduro = preco / 2;
            let pagamento = Math.floor((preco * 2) + terceiroProduro);

            let msgPromocao = document.querySelector('#msgPromocao');
            let msgPagamento = document.querySelector('#msgPagamento');

            msgPromocao.innerText = `${produto} - Promoção: Leve 3 por R$: ${pagamento.toFixed(2)}`;
            msgPagamento.innerText = `O 3° Produro custa apenas R$: ${terceiroProduro.toFixed(2)}`
        }

        //Vincula o botao 
        let botao = document.querySelector('#botao');
        botao.addEventListener('click', function(){
            calculo();
        });
    </script>
    </body>

</html>
