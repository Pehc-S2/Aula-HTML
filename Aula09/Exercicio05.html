<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 05</title>
    <style>      
        span{
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <h1>Restaurante JS</h1>

    <form action="">
        <p><label for="valorMinuto">Valor por 15min de Uso R$:</label>
        <input type="text" id="valorMinuto"></p>
        <p><label for="tempoUso">Tempo de Uso do Cliente (Min.):</label>
        <input type="text" id="tempoUso"></p>
        <input type="button" id="botao" value="Calcular Valor a Pagar">
    </form>
    <p><span id="msgPagamento"></span></p>

    <script>
        function calculo(){
            let valorMinuto = document.querySelector('#valorMinuto').value;
            let tempoUso = Number(document.querySelector('#tempoUso').value);

            // Calculo
            let bloco = Math.ceil(tempoUso / 15);
            let valorPagamento = bloco * valorMinuto;

            let msgPagamento = document.querySelector('#msgPagamento');

            msgPagamento.innerText = `Valor a pagar R$: ${valorPagamento.toFixed(2)}`;
        }

        //Vincula o botao 
        let botao = document.querySelector('#botao');
        botao.addEventListener('click', function(){
            calculo();
        });
    </script>
    </body>

</html>
