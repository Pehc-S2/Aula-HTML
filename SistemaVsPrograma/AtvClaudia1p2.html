<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/AtvClaudia1.css">
    <title>Sistema de insulfilm</title>
</head>

<body>
    <!--
    <header>
        <h1>Insulfamily</h1>
        <p>Segurança e privacidade, a família em primeiro lugar.</p>
    </header>
    -->
    <main>
        <section>
            <div>
                <h2>Cadastre-se</h2>
                <table><br>
                    <tr>
                        <td><label for="nome">Nome: </label></td>
                        <td><input type="text" id="nome" required></td>
                    </tr>
                    <tr>
                        <td><label for="senha">Senha: </label></td>
                        <td><input type="password" id="senha" required></td>
                    </tr>
                    <tr>
                        <td><label for="cpf">CPF: </label></td>
                        <td><input type="text" maxlength="11" id="cpf" required></td>
                    </tr>
                    <tr>
                        <td><label for="telefone">Telefone: </label></td>
                        <td><input type="text" id="telefone" required></td>
                    </tr>
                </table>
                <br><br><a href="" class="v1" id="botao">Avançar</a>
            </div>
        </section>
    </main>


    <script src="assets/js/AtvClaudia1.js"></script>
    <script>

        function enviar() {
            let nome = document.querySelector("#nome").value
            let senha = document.querySelector("#senha").value
            let cpf = document.querySelector("#cpf").value
            let telefone = document.querySelector("#telefone").value
          
            if (!nome || !senha || !cpf || !telefone) {
                alert("Valores invalidos");
                return;
            } else {
                document.getElementById('botao').setAttribute('href', 'AtvClaudia1p3.html')
            }}

            let botao = document.querySelector('#botao');
            botao.addEventListener('click', function () {
                enviar();
            });
    </script>
</body>

</html>
